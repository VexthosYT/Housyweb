```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter Arc Tracker</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #08111f, #10243b, #071018);
        color: white;
        padding: 25px;
    }

    .container {
        width: 100%;
        max-width: 850px;
        margin: auto;
    }

    .header {
        text-align: center;
        margin-bottom: 25px;
    }

    .header h1 {
        font-size: 42px;
        margin-bottom: 8px;
    }

    .header p {
        color: #aebdce;
        font-size: 15px;
    }

    .date {
        margin-top: 10px;
        color: #70c8ff;
        font-weight: bold;
    }

    .progress-card {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px;
        padding: 22px;
        margin-bottom: 22px;
        backdrop-filter: blur(10px);
    }

    .progress-top {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
    }

    .progress-number {
        font-size: 25px;
        font-weight: bold;
    }

    .progress-bar {
        width: 100%;
        height: 14px;
        background: #172637;
        border-radius: 20px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #39bdf8, #8be9fd);
        border-radius: 20px;
        transition: width 0.4s ease;
    }

    .streak {
        text-align: center;
        margin-top: 15px;
        color: #ffd166;
        font-weight: bold;
    }

    .tasks {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .task {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 17px;
        border-radius: 16px;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.08);
        transition: 0.25s;
    }

    .task:hover {
        transform: translateY(-2px);
        background: rgba(255,255,255,0.1);
    }

    .task.next {
        border: 2px solid #39bdf8;
        box-shadow: 0 0 18px rgba(57,189,248,0.25);
    }

    .task.completed {
        opacity: 0.55;
    }

    .task.completed .task-name {
        text-decoration: line-through;
    }

    input[type="checkbox"] {
        appearance: none;
        width: 25px;
        height: 25px;
        border: 2px solid #708399;
        border-radius: 8px;
        cursor: pointer;
        flex-shrink: 0;
        position: relative;
    }

    input[type="checkbox"]:checked {
        background: #39bdf8;
        border-color: #39bdf8;
    }

    input[type="checkbox"]:checked::after {
        content: "✓";
        position: absolute;
        color: #06111d;
        font-weight: bold;
        font-size: 18px;
        left: 4px;
        top: 0px;
    }

    .task-info {
        flex: 1;
    }

    .task-name {
        font-size: 17px;
        font-weight: bold;
    }

    .task-time {
        color: #8fa3b8;
        font-size: 13px;
        margin-top: 4px;
    }

    .next-label {
        color: #39bdf8;
        font-size: 12px;
        font-weight: bold;
        margin-top: 5px;
    }

    .reset-btn {
        display: block;
        margin: 25px auto 0;
        padding: 12px 22px;
        border: none;
        border-radius: 12px;
        background: #172637;
        color: white;
        cursor: pointer;
        font-size: 14px;
    }

    .reset-btn:hover {
        background: #243b52;
    }

    .quote {
        text-align: center;
        margin-top: 25px;
        color: #8fa3b8;
        font-style: italic;
    }

    @media (max-width: 600px) {
        body {
            padding: 15px;
        }

        .header h1 {
            font-size: 32px;
        }

        .task {
            padding: 14px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>❄️ WINTER ARC</h1>
        <p>One day. One mission. Become better.</p>
        <div class="date" id="date"></div>
    </div>

    <div class="progress-card">

        <div class="progress-top">
            <div>Today's Progress</div>
            <div class="progress-number" id="progressText">0 / 13</div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="streak">
            🔥 Current Streak: <span id="streak">0</span> days
        </div>

    </div>

    <div class="tasks" id="tasks"></div>

    <button class="reset-btn" onclick="resetToday()">
        🔄 Reset Today's Progress
    </button>

    <div class="quote">
        "Discipline beats motivation."
    </div>

</div>

<script>

const tasks = [
    { name: "Wake up", time: "5:15 AM" },
    { name: "Morning Run / Light Jog", time: "5:20 – 5:40 AM" },
    { name: "Cool Down + Stretch", time: "5:40 – 5:50 AM" },
    { name: "Freshen Up + Get Ready", time: "5:50 – 6:05 AM" },
    { name: "Breakfast", time: "6:05 – 6:15 AM" },
    { name: "School", time: "6:20 AM – 2:00 PM" },
    { name: "Lunch + Rest", time: "2:00 – 3:15 PM" },
    { name: "Homework + Study", time: "3:15 – 4:15 PM" },
    { name: "Outdoor Activity", time: "4:15 – 4:40 PM" },
    { name: "Tuition", time: "5:00 – 6:00 PM" },
    { name: "Self Study", time: "6:30 – 7:30 PM" },
    { name: "Revision + Prepare for Tomorrow", time: "8:30 – 9:15 PM" },
    { name: "Sleep", time: "9:45 PM" }
];

const todayKey = "winterArc_" + new Date().toISOString().split("T")[0];

function getSavedTasks() {
    const saved = localStorage.getItem(todayKey);

    if (saved) {
        return JSON.parse(saved);
    }

    return Array(tasks.length).fill(false);
}

let completed = getSavedTasks();

function saveTasks() {
    localStorage.setItem(todayKey, JSON.stringify(completed));
}

function renderTasks() {

    const container = document.getElementById("tasks");
    container.innerHTML = "";

    let nextFound = false;

    tasks.forEach((task, index) => {

        const div = document.createElement("div");

        div.className = "task";

        if (completed[index]) {
            div.classList.add("completed");
        }

        if (!completed[index] && !nextFound) {
            div.classList.add("next");
            nextFound = true;
        }

        div.innerHTML = `
            <input
                type="checkbox"
                ${completed[index] ? "checked" : ""}
                onchange="toggleTask(${index})"
            >

            <div class="task-info">

                <div class="task-name">
                    ${task.name}
                </div>

                <div class="task-time">
                    ⏰ ${task.time}
                </div>

                ${
                    !completed[index] && !nextFound
                    ? `<div class="next-label">NEXT TASK →</div>`
                    : ""
                }

            </div>
        `;

        container.appendChild(div);
    });

    updateProgress();
}

function toggleTask(index) {

    completed[index] = !completed[index];

    saveTasks();

    renderTasks();
}

function updateProgress() {

    const total = tasks.length;

    const done = completed.filter(Boolean).length;

    const percentage = (done / total) * 100;

    document.getElementById("progressText").textContent =
        `${done} / ${total}`;

    document.getElementById("progressFill").style.width =
        percentage + "%";

    if (done === total) {
        document.querySelector(".quote").textContent =
            "🏆 WINTER ARC COMPLETE — YOU DID IT!";
    }
}

function resetToday() {

    if (confirm("Reset today's progress?")) {

        completed = Array(tasks.length).fill(false);

        saveTasks();

        renderTasks();
    }
}

function showDate() {

    const now = new Date();

    const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    };

    document.getElementById("date").textContent =
        now.toLocaleDateString("en-IN", options);
}

/* ---------------------------
   STREAK SYSTEM
---------------------------- */

function calculateStreak() {

    let streak = 0;

    const today = new Date();

    while (true) {

        const date = new Date(today);

        date.setDate(today.getDate() - streak);

        const key =
            "winterArc_" +
            date.toISOString().split("T")[0];

        const saved = localStorage.getItem(key);

        if (!saved) break;

        const data = JSON.parse(saved);

        if (data.every(Boolean)) {
            streak++;
        } else {
            break;
        }
    }

    document.getElementById("streak").textContent = streak;
}

/* ---------------------------
   AUTOMATIC DAILY RESET
---------------------------- */

function checkNewDay() {

    const lastOpened =
        localStorage.getItem("winterArc_lastOpened");

    const today =
        new Date().toISOString().split("T")[0];

    if (lastOpened !== today) {

        localStorage.setItem(
            "winterArc_lastOpened",
            today
        );

        completed = getSavedTasks();
    }
}

checkNewDay();
showDate();
renderTasks();
calculateStreak();

</script>

</body>
</html>
